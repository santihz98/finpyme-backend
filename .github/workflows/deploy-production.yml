name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  notify:
    name: Production Deploy Triggered
    runs-on: ubuntu-latest
    steps:
      - name: Railway auto-deploy triggered
        run: |
          echo "✅ Push to main detected"
          echo "Railway will auto-deploy from GitHub integration"
          echo "Check deployment status at railway.app"
